<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheBuilds Chennai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="/shebuilds-logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      // TEMP PROBE — removed before finishing
      window.addEventListener('load', () => {
        setTimeout(() => {
          const vw = document.documentElement.clientWidth;
          const lines = [];
          lines.push(`viewport=${vw} docScrollW=${document.documentElement.scrollWidth} bodyScrollW=${document.body.scrollWidth}`);
          const h1 = document.querySelector('.hero-heading__primary');
          lines.push(`fontsReady=${document.fonts.status} baloo=${document.fonts.check('700 40px "Baloo 2"')} headingLines=${Math.round(h1.getBoundingClientRect().height / (parseFloat(getComputedStyle(h1).fontSize) * 0.92))} menuOpen=${document.querySelector('.navbar__mobile').dataset.open}`);
          const img = document.querySelector('.hero-visual__frame img');
          lines.push(`img natural=${img.naturalWidth}x${img.naturalHeight} complete=${img.complete} filter=${getComputedStyle(img).filter} objectFit=${getComputedStyle(img).objectFit}`);
          document.querySelectorAll('*').forEach((el) => {
            const r = el.getBoundingClientRect();
            if (r.width === 0) return;
            if (r.right > vw + 0.5 || r.left < -0.5) {
              lines.push(`OVERFLOW ${el.tagName}.${el.className && el.className.toString ? el.className.toString().slice(0,40) : ''} left=${r.left.toFixed(1)} right=${r.right.toFixed(1)} w=${r.width.toFixed(1)}`);
            }
          });
          const q = (sel) => { const e=document.querySelector(sel); if(!e) return `${sel} MISSING`;
            const r=e.getBoundingClientRect(); const cs=getComputedStyle(e);
            return `${sel} w=${r.width.toFixed(1)} h=${r.height.toFixed(1)} left=${r.left.toFixed(1)} right=${r.right.toFixed(1)} fs=${cs.fontSize} ct=${cs.containerType||'-'}`; };
          ['.navbar','.navbar__links','.navbar__register','.eyebrow','.pill-btn--secondary','.pill-btn--primary','.hero-description'].forEach(s=>lines.push(q(s)));
          // does any element stick out of its own parent's padding box?
          document.querySelectorAll('.hero-frame *').forEach((el) => {
            const p = el.parentElement; if (!p) return;
            const pr = p.getBoundingClientRect(); const cs = getComputedStyle(p);
            if (cs.overflowX !== 'visible') return;
            if (el.classList.contains('corner-deco')) return;
            if (el.tagName === 'IMG' && el.closest('.hero-visual__frame')) return;
            const r = el.getBoundingClientRect(); if (!r.width) return;
            const padR = pr.right - parseFloat(cs.paddingRight) - parseFloat(cs.borderRightWidth);
            const padL = pr.left + parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth);
            if (r.right > padR + 0.6 || r.left < padL - 0.6) {
              lines.push(`SPILL ${el.tagName}.${(el.className||'').toString().slice(0,34)} [${r.left.toFixed(1)},${r.right.toFixed(1)}] out of parent .${(p.className||'').toString().slice(0,24)} [${padL.toFixed(1)},${padR.toFixed(1)}]`);
            }
          });
          const pre = document.createElement('pre');
          pre.id = 'probe';
          pre.textContent = lines.join('\n');
          pre.style.display='none';
          document.body.appendChild(pre);
        }, 600);
      });
    </script>
  </body>
</html>
