<!doctype html>
<!-- TEMP dev harness for true small-viewport rendering. Deleted before finishing. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #2b2b2b; }
      iframe { border: 0; display: block; background: #fff; }
    </style>
  </head>
  <body>
    <iframe id="f"></iframe>
    <script>
      const p = new URLSearchParams(location.search);
      const w = +(p.get('w') || 390);
      const h = +(p.get('h') || 844);
      const f = document.getElementById('f');
      f.style.width = w + 'px';
      f.style.height = h + 'px';
      f.src = '/';
      f.addEventListener('load', () => {
        if (p.get('open')) {
          setTimeout(() => f.contentDocument.querySelector('.navbar__toggle').click(), 400);
        }
        setTimeout(() => {
          const inner = f.contentDocument.getElementById('probe');
          const pre = document.createElement('pre');
          pre.id = 'probe';
          pre.style.display = 'none';
          pre.textContent = inner ? inner.textContent : 'NO INNER PROBE';
          document.body.appendChild(pre);
        }, 1200);
      });
    </script>
  </body>
</html>
